name: Vigilar producción
# Cada 5 min (el cron de GitHub puede retrasarse unos minutos). vigilar.py solo reescribe estado.json si cambia
# algún servicio o toca latido (cada 30 min), así que solo hay commit cuando hay algo que contar.
# La concurrencia deja como mucho una vuelta en marcha y una en cola: no se multiplican.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vigilar
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Sin SLACK_WEBHOOK (o NTFY_TEMA) el aviso se salta sin fallar.
      - run: python3 vigilar.py
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
      - run: |
          git config user.name "pop-vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || { git commit -q -m "estado $(date -u +%H:%M)" && git pull -q --rebase && git push -q; }

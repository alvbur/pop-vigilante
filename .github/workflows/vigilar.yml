name: Vigilar producción
# Cada 5 min, 24/7. El cron de GitHub no siempre salta en repos nuevos o con poca actividad, así que cada vuelta
# espera ~5 min y lanza la siguiente (workflow_dispatch con el GITHUB_TOKEN sí crea ejecuciones nuevas).
# La concurrencia deja como mucho una vuelta en marcha y una en cola: no se multiplican.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vigilar
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 vigilar.py
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
      - run: |
          git config user.name "pop-vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || { git commit -q -m "estado $(date -u +%H:%M)" && git pull -q --rebase && git push -q; }
      - name: Siguiente vuelta en ~5 min
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 270
          gh workflow run vigilar.yml -R "$GITHUB_REPOSITORY"

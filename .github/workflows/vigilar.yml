name: Vigilar producción
# 22/10/2026: el cron de GitHub es poco fiable (se salta o retrasa horas las ejecuciones), así que la vigilancia es una
# cadena que se relanza sola: cada ejecución vigila cada 5 min durante ~5 h 45 min y al acabar lanza la siguiente con el
# GITHUB_TOKEN (workflow_dispatch sí crea ejecución nueva aunque lo dispare el token; push o schedule no lo harían).
# El schedule queda solo como red de seguridad por si la cadena se rompe. vigilar.py solo reescribe estado.json si cambia
# algún servicio o toca latido (cada 30 min), así que solo hay commit cuando hay algo que contar.
# La concurrencia deja como mucho una ejecución en marcha y otra en cola: nunca hay dos cadenas a la vez. Cada ejecución,
# nada más empezar, deja ya en cola a la siguiente, así que aunque esta muera de golpe no se queda el relevo sin hacer.
# 23/10: en cada vuelta, produccion.py rehace estado-produccion.json cada 15 min (lo que daba pop/subida/estado.py en el PC).
# Para parar la vigilancia del todo: gh workflow disable vigilar.yml (cancelar una ejecución no basta, relanza la siguiente).
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vigilar
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Dejar en cola la siguiente ejecución
        run: gh workflow run vigilar.yml --ref main || echo "::warning::no pude dejar la siguiente en cola; la lanzará el último paso"
      # 10/11/2026 (minutos de Actions): la prueba de humo de cada despliegue se hace aquí (repo público, gratis) y no en la
      # subida de pop_backend. La misma versión de Playwright que allí. Si no se instala, despliegues.py avisa «sin humo».
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright para la prueba de humo
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Vigilar cada 5 min durante ~5 h 45 min
        env:
          # Sin SLACK_WEBHOOK (o NTFY_TEMA) el aviso se salta sin fallar.
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          # 23/10: estado-produccion.json (repos, CI, PR y despliegues de los 3 repos, solo números) para el panel, cada 15 min.
          # Llave fine-grained de solo lectura; sin ella el archivo sale igual, con la producción y «falta la llave» en cada repo.
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
          WEB_TOKEN: ${{ secrets.WEB_TOKEN }}
          # 10/11: cada 5 min (antes 15): la CI de las PR ya no la apunta estado.yml de back y front, la da este archivo
          REPOS_CADA_S: "300"
          CONSUMO_CADA_S: "3600"
          VUELTA_S: "300"
          DURACION_S: "20700"
        run: |
          # Sin set -e: una vuelta que falle no mata la cadena; se avisa y se sigue con la siguiente.
          set +e
          git config user.name "pop-vigilante"
          git config user.email "vigilante@users.noreply.github.com"
          rama="${GITHUB_REF_NAME:-main}"
          publicar() {
            for i in 1 2 3 4; do
              git pull -q --rebase origin "$rama" && git push -q origin "HEAD:$rama" && return 0
              git rebase --abort 2>/dev/null
              sleep $((i * 5))
            done
            return 1
          }
          fin=$(( $(date +%s) + DURACION_S ))
          n=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            n=$((n + 1))
            inicio=$(date +%s)
            echo "== vuelta $n · $(TZ=Europe/Madrid date '+%H:%M:%S') (Barcelona) =="
            # Parte de lo último publicado (y recoge cambios de vigilar.py si se fusionó algo mientras tanto).
            git fetch -q origin "$rama" && git reset -q --hard FETCH_HEAD || echo "::warning::no pude sincronizar con origin, sigo con lo que hay"
            python3 vigilar.py || echo "::warning::vigilar.py falló en la vuelta $n, sigo"
            [ -f produccion.py ] && { python3 produccion.py || echo "::warning::produccion.py falló en la vuelta $n, sigo"; }
            # 10/11: despliegues (commit servido), su prueba de humo y el aviso si una construcción falla o no llega
            [ -f despliegues.py ] && { python3 despliegues.py || echo "::warning::despliegues.py falló en la vuelta $n, sigo"; }
            # 10/11: minutos de Actions de Álvaro y Fabián (consumo-actions.json, 1 vez por hora; aviso al 70/90/100 %)
            [ -f consumo.py ] && { python3 consumo.py || echo "::warning::consumo.py falló en la vuelta $n, sigo"; }
            git add estado.json
            [ -f estado-produccion.json ] && git add estado-produccion.json
            for f in consumo-actions.json consumo-cache.json estado-despliegues.json; do [ -f "$f" ] && git add "$f"; done
            if ! git diff --cached --quiet; then
              git commit -q -m "estado $(date -u +%H:%M)" || echo "::warning::no pude hacer commit en la vuelta $n"
              publicar && echo "estado.json publicado" || echo "::warning::no pude publicar estado.json en la vuelta $n; se reintenta en la siguiente"
            fi
            siguiente=$((inicio + VUELTA_S))
            [ "$siguiente" -gt "$fin" ] && siguiente=$fin
            ahora=$(date +%s)
            [ "$siguiente" -gt "$ahora" ] && sleep $((siguiente - ahora))
          done
          echo "Fin de la cadena de esta ejecución tras $n vueltas; el último paso lanza la siguiente."
          exit 0
      - name: Capturas de la prueba de humo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humo-capturas
          path: humo-capturas
          retention-days: 7
          if-no-files-found: ignore

      - name: Lanzar la siguiente ejecución
        if: always()
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run vigilar.yml --ref main && exit 0
            sleep $((i * 10))
          done
          echo "::error::no pude lanzar la siguiente ejecución"
          exit 1
